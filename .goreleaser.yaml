version: 2

project_name: authz-graph

before:
  hooks:
    - go mod tidy

builds:
  - id: authz-graph
    binary: authz-graph
    main: ./cmd/authz-graph

    env:
      - CGO_ENABLED=0

    goos:
      - linux
      - darwin
      - windows

    goarch:
      - amd64
      - arm64

    ldflags:
      - -s -w
      - -X main.version={{ .Version }}

archives:
  - id: authz-graph
    ids:
      - authz-graph

    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

    formats:
      - tar.gz

    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: becash143
    name: authz-graph

changelog:
  sort: asc
